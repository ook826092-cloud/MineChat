name: 生成安卓签名 (One-shot)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-signing-generator
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 生成随机密码与别名
        id: creds
        run: |
          echo "store_pw=$(openssl rand -base64 24 | tr -dc 'A-Za-z0-9' | head -c 32)" >> "$GITHUB_OUTPUT"
          echo "key_pw=$(openssl rand -base64 24 | tr -dc 'A-Za-z0-9' | head -c 32)" >> "$GITHUB_OUTPUT"
          echo "alias=minechat" >> "$GITHUB_OUTPUT"

      - name: 生成 keystore 与 signing.properties
        run: |
          mkdir -p ci-signing
          keytool -genkeypair -v \
            -keystore ci-signing/release.jks \
            -alias "${{ steps.creds.outputs.alias }}" \
            -keyalg RSA -keysize 2048 -validity 36500 \
            -storepass "${{ steps.creds.outputs.store_pw }}" \
            -keypass "${{ steps.creds.outputs.key_pw }}" \
            -dname "CN=MineChat, OU=ook826092-cloud, O=ook826092-cloud, L=Beijing, ST=Beijing, C=CN"
          cat > ci-signing/signing.properties <<EOF
          storePassword=${{ steps.creds.outputs.store_pw }}
          keyAlias=${{ steps.creds.outputs.alias }}
          keyPassword=${{ steps.creds.outputs.key_pw }}
          EOF
          echo "生成结果："
          ls -la ci-signing/

      - name: 提交签名文件到仓库
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f ci-signing/release.jks ci-signing/signing.properties
          git commit -m "chore: 添加安卓签名文件（ci-signing）"
          git push

      - name: 输出签名凭据
        run: |
          echo "============================================================"
          echo " 签名文件已提交：ci-signing/release.jks + signing.properties"
          echo "------------------------------------------------------------"
          echo "  keyAlias       : ${{ steps.creds.outputs.alias }}"
          echo "  storePassword  : ${{ steps.creds.outputs.store_pw }}"
          echo "  keyPassword    : ${{ steps.creds.outputs.key_pw }}"
          echo "============================================================"

      - name: 自毁（删除本一次性 workflow）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/generate-android-signing.yml
          git commit -m "chore: 签名文件已生成，移除一次性 workflow"
          git push
          echo "已自毁 ✓"
