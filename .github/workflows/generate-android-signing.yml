name: 生成安卓签名 (One-shot)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-signing-generator
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 生成随机密码与别名
        id: creds
        run: |
          echo "store_pw=$(openssl rand -base64 24 | tr -dc 'A-Za-z0-9' | head -c 32)" >> "$GITHUB_OUTPUT"
          echo "key_pw=$(openssl rand -base64 24 | tr -dc 'A-Za-z0-9' | head -c 32)" >> "$GITHUB_OUTPUT"
          echo "alias=minechat" >> "$GITHUB_OUTPUT"

      - name: 生成 keystore（RSA 2048 / 100 年有效期）
        run: |
          keytool -genkeypair -v \
            -keystore minechat-release.keystore \
            -alias "${{ steps.creds.outputs.alias }}" \
            -keyalg RSA -keysize 2048 -validity 36500 \
            -storepass "${{ steps.creds.outputs.store_pw }}" \
            -keypass "${{ steps.creds.outputs.key_pw }}" \
            -dname "CN=MineChat, OU=ook826092-cloud, O=ook826092-cloud, L=Beijing, ST=Beijing, C=CN"
          echo "keystore 生成完成："
          ls -la minechat-release.keystore

      - name: 输出签名凭据
        run: |
          echo "============================================================"
          echo " 安卓签名信息（由 AI 助手代为写入仓库 Secrets）"
          echo "------------------------------------------------------------"
          echo "  keyAlias       : ${{ steps.creds.outputs.alias }}"
          echo "  storePassword  : ${{ steps.creds.outputs.store_pw }}"
          echo "  keyPassword    : ${{ steps.creds.outputs.key_pw }}"
          echo "============================================================"

      - name: 上传 keystore 供自动化保存
        uses: actions/upload-artifact@v4
        with:
          name: android-keystore
          path: minechat-release.keystore
          if-no-files-found: error

      - name: 自毁（删除本一次性 workflow）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/generate-android-signing.yml
          git commit -m "chore: 签名文件已生成，移除一次性 workflow"
          git push
          echo "已自毁 ✓"
