name: 编译 APK 并发布 Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: minechat-build-apk-v2
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: 拉取代码（含子模块）
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: 安装 Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: 安装 NDK 与 CMake
        uses: android-actions/setup-android@v3
        with:
          packages: "ndk;28.2.13676358 cmake;3.22.1"

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-cleanup: true

      - name: 配置签名密钥（ci-signing → keystore.properties）
        run: |
          if [ -f ci-signing/release.jks ]; then
            STORE_PW=$(grep '^storePassword=' ci-signing/signing.properties | cut -d= -f2)
            ALIAS=$(grep '^keyAlias=' ci-signing/signing.properties | cut -d= -f2)
            # 新 JDK 的 keytool 默认生成 PKCS12（.jks 只是文件名），且 PKCS12 的
            # key 密码强制等于 store 密码（生成时指定的 keypass 会被忽略）。
            # 这里转成真正的 JKS 并统一用 storePassword，否则 AGP 读 key 会解密失败。
            keytool -importkeystore -noprompt \
              -srckeystore ci-signing/release.jks -srcstorepass "$STORE_PW" -srcstoretype PKCS12 \
              -destkeystore ci-signing/release-jks.jks -deststorepass "$STORE_PW" -deststoretype JKS \
              -destkeypass "$STORE_PW"
            {
              echo "STORE_FILE=${{ github.workspace }}/ci-signing/release-jks.jks"
              echo "STORE_PASSWORD=$STORE_PW"
              echo "KEY_ALIAS=$ALIAS"
              echo "KEY_PASSWORD=$STORE_PW"
            } > keystore.properties
            echo "✅ 已转换 PKCS12 → JKS 并配置签名（alias=$ALIAS）"
          else
            echo "⚠️ 未找到 ci-signing/release.jks，使用 debug 签名"
          fi

      - name: 修复上游大小写问题（settings 注册 :rag，目录实际为 RAG）
        run: |
          # 上游在大小写不敏感系统开发：settings.gradle.kts include(":rag")
          # 但仓库目录名为 RAG，Linux 下找不到，建软链接绕过（不改上游源码）
          if [ -d RAG ] && [ ! -e rag ]; then
            ln -s RAG rag
            echo "✅ 已创建软链接 rag -> RAG"
          fi

      - name: 编译 Release APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease

      - name: 提取版本信息
        id: version
        run: |
          VN=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          VC=$(grep -oP 'versionCode\s*=\s*\K\d+' app/build.gradle.kts | head -1)
          echo "vn=${VN:-未知}" >> "$GITHUB_OUTPUT"
          echo "vc=${VC:-未知}" >> "$GITHUB_OUTPUT"
          echo "版本: $VN (versionCode $VC)"

      - name: 备份 APK 到 Actions 工件
        uses: actions/upload-artifact@v4
        with:
          name: minechat-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 7

      - name: 生成 Release 标签
        id: tag
        run: |
          TAG="build-$(TZ=Asia/Shanghai date +%Y%m%d-%H%M%S)"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "标签: ${TAG}"

      - name: 创建 Release + 上传 APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: MineChat v${{ steps.version.outputs.vn }} (${{ steps.tag.outputs.tag }})
          body: |
            MineChat Release APK
            - 版本: ${{ steps.version.outputs.vn }} (versionCode ${{ steps.version.outputs.vc }})
            - 架构: arm64-v8a / x86_64 / universal
            - 签名: ci-signing (release.jks)
            - 自动编译于 GitHub Actions
          files: app/build/outputs/apk/release/*.apk
          draft: false
          prerelease: true
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建失败自动建 Issue
        if: failure()
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const repo = await github.rest.repos.get({ owner: context.repo.owner, repo: context.repo.repo });
            if (!repo.data.has_issues) { console.log('仓库未启用 Issues，跳过'); return; }
            const title = `⛔ APK 构建失败 #${context.runId}`;
            const q = `repo:${context.repo.owner}/${context.repo.repo} type:issue state:open in:title "${title}"`;
            const { data: search } = await github.rest.search.issuesAndPullRequests({ q });
            if (search.total_count > 0) return;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: [
                '构建失败详情：',
                `- 触发方式：${context.eventName}`,
                `- 分支：${context.ref}`,
                `- 运行日志：${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                '',
                '本 Issue 由 Actions 自动创建，构建成功后请手动关闭。',
              ].join('\n')
            });
